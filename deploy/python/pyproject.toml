[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "science-agent"
version = "0.1.0"
description = "Phase-one Python skeleton for an event-driven agent SDK"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "panda_eyes" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
]
rag = [
  "docling>=2.113,<3",
  "pymupdf>=1.24,<2",
  "pymilvus>=2.5,<3",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/science_agent", "src/science_agent_web"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = "--basetemp=/tmp/science-agent-pytest"
cache_dir = "/tmp/science-agent-pytest-cache"

[tool.ruff]
cache-dir = "/tmp/science-agent-ruff"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
